<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Lumi · 3D 水晶徽章墙原型</title>
<!--
  视觉原型（spec / 演示）—— 不进 App WebView。
  premium 3D 水晶：PBR(清漆/虹彩/反射) + 环境贴图(PMREM) + UnrealBloom 辉光 + ACES，
  逐徽章霓虹色、清晰徽记、拖拽/陀螺仪倾斜、点击大图、解锁 cinematic。
  原生对齐：iOS 用 SceneKit 真 3D 水晶(详情/解锁) + 墙用快照 + 清晰 SF Symbol 徽记。
-->
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:radial-gradient(circle at 50% 35%,#15152a 0%,#0a0a14 60%,#06060e 100%);overflow:hidden;
            font-family:-apple-system,"PingFang SC",system-ui,sans-serif;color:#fff}
  #app{position:fixed;inset:0}
  canvas{display:block}
  .hud{position:fixed;left:0;right:0;text-align:center;pointer-events:none;user-select:none}
  .hud.top{top:20px}
  .hud.top .t{font-size:15px;font-weight:800;letter-spacing:3px;
    background:linear-gradient(90deg,#FF3D9A,#A24CFF,#3DE0FF);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .hud.top .s{font-size:11px;margin-top:5px;color:#7d8bb4;letter-spacing:.5px}
  .controls{position:fixed;bottom:26px;left:0;right:0;display:flex;gap:12px;justify-content:center;z-index:20}
  button{font:inherit;font-size:13px;font-weight:700;color:#fff;border:0;padding:13px 22px;border-radius:999px;
    background:linear-gradient(90deg,#FF3D9A,#A24CFF,#3DE0FF);box-shadow:0 10px 30px rgba(162,76,255,.45);cursor:pointer;
    transition:transform .15s}
  button:active{transform:scale(.95)}
  button.ghost{background:rgba(20,20,32,.7);border:1px solid #2a2a40;box-shadow:none;color:#c9c2d6}
  /* 详情玻璃面板 */
  #panel{position:fixed;left:50%;bottom:-70%;transform:translateX(-50%);width:min(92vw,440px);
    background:rgba(16,16,28,.72);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);
    border:1px solid rgba(255,255,255,.1);border-radius:30px 30px 0 0;padding:26px 26px 34px;z-index:30;
    transition:bottom .5s cubic-bezier(.2,.85,.2,1)}
  #panel.show{bottom:0}
  #panel .tier{font-size:11px;font-weight:800;letter-spacing:2px}
  #panel .name{font-size:26px;font-weight:800;margin-top:8px}
  #panel .en{font-size:12px;color:#8585a0;margin-top:2px;letter-spacing:1px}
  #panel .desc{font-size:13.5px;color:#c9c2d6;line-height:1.55;margin-top:16px}
  #panel .own{font-size:11.5px;color:#E6C18C;margin-top:14px}
  #panel .row{display:flex;gap:12px;margin-top:20px}
  #panel .row button{flex:1}
  #panel .close{position:absolute;top:18px;right:20px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#aaa;cursor:pointer;pointer-events:auto}
  /* 解锁文字 */
  #unlockText{position:fixed;left:0;right:0;top:58%;text-align:center;z-index:25;opacity:0;pointer-events:none;
    transition:opacity .5s,transform .5s;transform:translateY(20px)}
  #unlockText.show{opacity:1;transform:translateY(0)}
  #unlockText .k{font-size:12px;font-weight:800;letter-spacing:4px;color:#3DE0FF}
  #unlockText .n{font-size:34px;font-weight:800;margin-top:8px;
    text-shadow:0 0 24px rgba(162,76,255,.7)}
  #unlockText .tg{font-size:12px;font-weight:800;letter-spacing:2px;margin-top:6px}
  .tap{position:fixed;left:0;right:0;bottom:80px;text-align:center;font-size:11px;color:#6a6a86;z-index:25;opacity:0;transition:opacity .4s}
  .tap.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<div class="hud top"><div class="t">LUMI · 徽章墙</div><div class="s">拖动 / 倾斜看折射流光 · 点击徽章看大图</div></div>
<div class="controls">
  <button id="unlock">模拟解锁 ✦</button>
  <button class="ghost" id="gyro">开启陀螺仪</button>
</div>
<div id="panel">
  <div class="close" id="panelClose">✕</div>
  <div class="tier" id="pTier"></div>
  <div class="name" id="pName"></div>
  <div class="en" id="pEn"></div>
  <div class="desc" id="pDesc"></div>
  <div class="own" id="pOwn"></div>
  <div class="row"><button id="pShare">分享 ✦</button></div>
</div>
<div id="unlockText"><div class="k">成就解锁 · UNLOCKED</div><div class="n" id="uName"></div><div class="tg" id="uTier"></div></div>
<div class="tap" id="tapHint">点击任意处继续</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// —— 徽章数据（参考表节选）——
const BADGES = [
  { name:'亚洲之星',    en:'Star of Asia',        color:0xFF3366, glyph:'★', tier:'EPIC · 史诗',     desc:'在亚洲点亮足迹。',                  own:'全球 11% 拥有' },
  { name:'欧洲漫游者',  en:'Europe Roamer',       color:0x33CCFF, glyph:'◆', tier:'RARE · 稀有',     desc:'在欧洲点亮足迹。',                  own:'全球 19% 拥有' },
  { name:'非洲开拓者',  en:'Africa Pioneer',      color:0x00CC66, glyph:'✿', tier:'RARE · 稀有',     desc:'在非洲点亮首个国家。',              own:'全球 14% 拥有' },
  { name:'美洲征服者',  en:'Americas Conqueror',  color:0xFF6600, glyph:'▲', tier:'EPIC · 史诗',     desc:'在北美 / 南美点亮首个国家。',       own:'全球 3% 拥有'  },
  { name:'大洋洲游牧民',en:'Oceania Nomad',       color:0x00F2FE, glyph:'≋', tier:'EPIC · 史诗',     desc:'在大洋洲点亮首个国家。',            own:'全球 6% 拥有'  },
  { name:'制霸七大洲',  en:'All Continents',      color:0xFF9900, glyph:'◉', tier:'LEGENDARY · 传说',desc:'全球 7 个大洲均至少含 1 个足迹。',  own:'全球 1% 拥有'  },
  { name:'南极洲探险家',en:'Antarctica Explorer', color:0xCFEFFF, glyph:'❄', tier:'LEGENDARY · 传说',desc:'在南极洲（南纬 60° 以下）打卡。',    own:'全球 0.5% 拥有'},
  { name:'跳岛狂人',    en:'Island Hopper',       color:0x00BFA5, glyph:'⚓', tier:'RARE · 稀有',     desc:'点亮 3 个不相连的岛屿国家 / 地区。',own:'全球 7% 拥有' },
  { name:'环球旅行家',  en:'Globetrotter',        color:0xFF0055, glyph:'✦', tier:'EPIC · 史诗',     desc:'点亮 30 个国家解锁。',              own:'全球 5% 拥有'  },
];

const app = document.getElementById('app');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 11);

const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
app.appendChild(renderer.domElement);

// 环境贴图（PMREM）→ 水晶真实反射
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

// 灯光：彩色点光勾勒折射
scene.add(new THREE.AmbientLight(0x223044, 1.2));
const l1 = new THREE.PointLight(0x3DE0FF, 60, 40); l1.position.set(-6, 5, 6); scene.add(l1);
const l2 = new THREE.PointLight(0xFF3D9A, 70, 40); l2.position.set(6, -4, 6); scene.add(l2);
const l3 = new THREE.DirectionalLight(0xffffff, 1.6); l3.position.set(0, 6, 4); scene.add(l3);

// 后处理：bloom 辉光
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.9, 0.7, 0.85);
composer.addPass(bloom);

// —— 清晰徽记纹理（512px，高 anisotropy，不糊）——
const maxAniso = renderer.capabilities.getMaxAnisotropy();
function glyphTexture(glyph){
  const S = 512, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const cx = cv.getContext('2d');
  cx.clearRect(0,0,S,S);
  cx.fillStyle = '#ffffff';
  cx.font = '700 300px -apple-system,"PingFang SC",system-ui,sans-serif';
  cx.textAlign = 'center'; cx.textBaseline = 'middle';
  cx.shadowColor = 'rgba(255,255,255,.9)'; cx.shadowBlur = 26;
  cx.fillText(glyph, S/2, S/2 + 10);
  const tex = new THREE.CanvasTexture(cv);
  tex.anisotropy = maxAniso; tex.minFilter = THREE.LinearMipmapLinearFilter; tex.generateMipmaps = true;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function crystalMaterial(color, glass=false){
  return new THREE.MeshPhysicalMaterial({
    color, metalness:0.0, roughness:0.06,
    transmission: glass ? 0.96 : 0.25, thickness: glass ? 2.2 : 1.0,
    ior: 1.9, clearcoat:1.0, clearcoatRoughness:0.06,
    iridescence:1.0, iridescenceIOR:1.5, iridescenceThicknessRange:[120,420],
    attenuationColor: new THREE.Color(color), attenuationDistance: glass ? 1.2 : 4.0,
    emissive: new THREE.Color(color), emissiveIntensity: 0.12,
    envMapIntensity: 1.6, flatShading: true, transparent: !glass, opacity: glass ? 1 : 0.92,
  });
}

const GEO = new THREE.IcosahedronGeometry(0.92, 0);   // 棱面折射
const wall = new THREE.Group(); scene.add(wall);
const items = [];

// 蜂巢布局 3 / 3 / 3（错位）
const rows = [3,3,3], dx = 2.7, dy = 2.5;
let bi = 0;
rows.forEach((n, r) => {
  const y = (1 - r) * dy + 0.2;
  const offset = (r % 2 === 0) ? 0 : dx * 0.5;
  for (let i = 0; i < n && bi < BADGES.length; i++, bi++) {
    const b = BADGES[bi];
    const crystal = new THREE.Mesh(GEO, crystalMaterial(b.color));
    const x = (i - (n - 1) / 2) * dx + offset;
    crystal.position.set(x, y, 0);

    // 徽记 sprite（始终朝向相机、清晰）
    const spr = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glyphTexture(b.glyph), transparent:true, depthTest:false, opacity:0.96,
    }));
    spr.scale.set(0.78, 0.78, 1);

    const g = new THREE.Group();
    g.position.copy(crystal.position);
    crystal.position.set(0,0,0); spr.position.set(0,0,0.6);
    g.add(crystal); g.add(spr);
    g.userData = { badge:b, home:g.position.clone(), crystal, spr,
                   spin: 0.2 + Math.random()*0.3, phase: Math.random()*6.28 };
    wall.add(g);
    items.push(g);
  }
});

// —— 倾斜 ——
const tilt = new THREE.Vector2(), tiltTarget = new THREE.Vector2();
addEventListener('pointermove', e => {
  if (mode !== 'wall') return;
  tiltTarget.set((e.clientX/innerWidth-0.5)*2, (e.clientY/innerHeight-0.5)*2);
});
document.getElementById('gyro').onclick = async () => {
  if (typeof DeviceOrientationEvent!=='undefined' && DeviceOrientationEvent.requestPermission) {
    try { await DeviceOrientationEvent.requestPermission(); } catch(e){}
  }
  addEventListener('deviceorientation', e => { tiltTarget.set((e.gamma||0)/45, (e.beta||0)/45); });
};

// —— 状态 ——
let mode = 'wall';            // wall | detail | unlock
let focused = null;
const focusPos = new THREE.Vector3(0, 0.3, 6.5);
const panel = document.getElementById('panel');

const ray = new THREE.Raycaster();
addEventListener('pointerdown', e => {
  if (e.target.closest('#panel') || e.target.closest('.controls')) return;
  if (mode === 'unlock') { endUnlock(); return; }
  if (mode === 'detail') return;
  const nd = new THREE.Vector2(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight*2-1));
  ray.setFromCamera(nd, camera);
  const hit = ray.intersectObjects(items.map(g=>g.userData.crystal))[0];
  if (hit) openDetail(hit.object.parent);
});

function fillPanel(b){
  document.getElementById('pTier').textContent = b.tier; document.getElementById('pTier').style.color = '#'+b.color.toString(16).padStart(6,'0');
  document.getElementById('pName').textContent = b.name;
  document.getElementById('pEn').textContent = b.en;
  document.getElementById('pDesc').textContent = b.desc;
  document.getElementById('pOwn').textContent = '◆ ' + b.own;
}
function openDetail(g){
  mode = 'detail'; focused = g;
  g.userData.crystal.material = crystalMaterial(g.userData.badge.color, true); // 升级为真玻璃
  fillPanel(g.userData.badge);
  panel.classList.add('show');
}
function closeDetail(){
  if (!focused) return;
  focused.userData.crystal.material = crystalMaterial(focused.userData.badge.color, false);
  panel.classList.remove('show'); focused = null; mode = 'wall';
}
document.getElementById('panelClose').onclick = closeDetail;
document.getElementById('pShare').onclick = () => alert('（原型）分享：原生用 ShareLink 渲染成图分享');

// —— 解锁 cinematic ——
let burst=null, ring=null, uCrystal=null, uT=0;
function startUnlock(){
  const b = BADGES[Math.floor(Math.random()*BADGES.length)];
  mode='unlock'; uT=0;
  // 中心大水晶
  uCrystal = new THREE.Group();
  const cr = new THREE.Mesh(GEO, crystalMaterial(b.color, true)); cr.scale.setScalar(0.01);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:glyphTexture(b.glyph), transparent:true, depthTest:false }));
  spr.scale.set(1.0,1.0,1); spr.position.z=0.8;
  uCrystal.add(cr); uCrystal.add(spr); uCrystal.position.copy(focusPos); uCrystal.userData={cr,spr};
  scene.add(uCrystal);
  // 冲击波环
  ring = new THREE.Mesh(new THREE.RingGeometry(0.9,1.0,64),
    new THREE.MeshBasicMaterial({ color:b.color, transparent:true, opacity:0.9, side:THREE.DoubleSide, blending:THREE.AdditiveBlending }));
  ring.position.copy(focusPos); scene.add(ring);
  // 粒子
  const N=260, pos=new Float32Array(N*3), vel=[];
  for(let i=0;i<N;i++){ pos[i*3]=0;pos[i*3+1]=0;pos[i*3+2]=0; const a=Math.random()*6.28,e=(Math.random()-0.5)*2,s=2+Math.random()*5;
    vel.push(new THREE.Vector3(Math.cos(a)*s,Math.sin(a)*s,e)); }
  const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  burst=new THREE.Points(pg,new THREE.PointsMaterial({color:b.color,size:0.13,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  burst.position.copy(focusPos); burst.userData={vel}; scene.add(burst);
  // 文案 + 触感（原生）
  document.getElementById('uName').textContent=b.name;
  const ut=document.getElementById('uTier'); ut.textContent=b.tier; ut.style.color='#'+b.color.toString(16).padStart(6,'0');
  if(navigator.vibrate) navigator.vibrate(40);
}
function endUnlock(){
  [uCrystal,ring,burst].forEach(o=>o&&scene.remove(o));
  uCrystal=ring=burst=null; mode='wall';
  document.getElementById('unlockText').classList.remove('show');
  document.getElementById('tapHint').classList.remove('show');
}
document.getElementById('unlock').onclick = () => { if(mode==='wall') startUnlock(); };

// —— 渲染循环 ——
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  tilt.lerp(tiltTarget, 0.05);
  wall.rotation.y = tilt.x * 0.35;
  wall.rotation.x = tilt.y * 0.22;

  items.forEach(g=>{
    const u=g.userData;
    const isFocus = (g===focused);
    // idle 自转 + 浮动
    u.crystal.rotation.y += 0.004 * u.spin*3;
    u.crystal.rotation.x = Math.sin(t*0.5+u.phase)*0.15;
    const target = isFocus ? focusPos : u.home;
    g.position.lerp(target, 0.12);
    const sc = isFocus ? 2.1 : (focused ? 0.82 : 1.0);
    g.scale.x += (sc-g.scale.x)*0.12; g.scale.y=g.scale.x; g.scale.z=g.scale.x;
    u.spr.material.opacity += ((focused && !isFocus)?0.25:0.96 - u.spr.material.opacity)*0.2;
    if(isFocus) u.crystal.rotation.y += 0.012;
  });

  // 解锁动画推进
  if(mode==='unlock' && uCrystal){
    uT += 0.016;
    const cr=uCrystal.userData.cr;
    const s = Math.min(1.9, 1.9*(1-Math.exp(-uT*4)));      // 弹簧式放大
    cr.scale.setScalar(Math.max(0.01,s)); cr.rotation.y+=0.03; cr.rotation.x+=0.012;
    bloom.strength = 0.9 + Math.max(0, 1.6*(1-uT));         // 入场闪光
    if(ring){ const rs=1+uT*7; ring.scale.setScalar(rs); ring.material.opacity=Math.max(0,0.9-uT*0.9); }
    if(burst){ const p=burst.geometry.attributes.position; burst.userData.vel.forEach((v,i)=>{
      p.array[i*3]+=v.x*0.016;p.array[i*3+1]+=v.y*0.016;p.array[i*3+2]+=v.z*0.016;v.multiplyScalar(0.95);});
      p.needsUpdate=true; burst.material.opacity=Math.max(0,1-uT/1.6); }
    if(uT>0.5) document.getElementById('unlockText').classList.add('show');
    if(uT>0.9) document.getElementById('tapHint').classList.add('show');
  } else {
    bloom.strength += (0.9 - bloom.strength)*0.1;
  }

  composer.render();
}
animate();

addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight); composer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
